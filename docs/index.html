<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>龙首谷1号仓库</title>
  <!-- ?v= 是给缓存用的：Pages 对 js/css 是 max-age=600，改完不换地址的话
       浏览器会继续吃十分钟旧的。每次动 app.js / style.css 就把这个数 +1。 -->
  <link rel="stylesheet" href="./style.css?v=7">
</head>
<body>
  <div class="topbar">
    <h1 id="title">库存清单</h1>
    <span class="count" id="count"></span>
    <span class="status-dot" id="statusDot" title="未配置写入"></span>
  </div>

  <!-- 库存页 -->
  <section class="page active" id="page-inv">
    <div class="searchbar"><input id="search" type="search" placeholder="搜索名称 / 位置 / 备注…"></div>
    <div class="list" id="invList"></div>
  </section>

  <!-- 货架页 -->
  <section class="page" id="page-shelf">
    <div class="searchbar">
      <input id="searchShelf" type="search" placeholder="搜索物料，货架上会闪烁定位…">
    </div>
    <div class="shelf-bar">
      <div class="shelf-modes" id="shelfModes"></div>
      <button class="view-toggle" id="viewToggle" title="切换视角">侧视</button>
    </div>
    <div class="shelf-hint" id="shelfHint"></div>
    <div class="warehouse" id="warehouse"></div>
    <div class="unplaced" id="unplaced"></div>
  </section>

  <!-- 设置页 -->
  <section class="page" id="page-set">
    <div class="settings">
      <h2 style="margin-bottom:14px;">设置</h2>
      <p class="hint">看库存不用任何配置。只有<strong>改库存 / 加物料 / 传图 / 动货架</strong>才需要<strong>编辑密码</strong>。所有写入都经服务器代理，浏览器不接触 GitHub token。设置只存在这台设备。</p>
      <div class="field"><label>你的名字（会记进改动记录）</label><input id="cfgWho" placeholder="例如 张三"></div>
      <div class="field">
        <label>编辑密码（改库存时需要）</label>
        <input id="cfgPassword" type="password" autocomplete="new-password" placeholder="输入编辑密码">
        <p class="hint sub" id="pwState"></p>
      </div>
      <div class="field"><label>Worker 地址（已内置，一般留空）</label><input id="cfgWorker" placeholder="https://xxx.workers.dev"></div>
      <div class="btns">
        <button class="btn ghost" id="cfgTest">测试</button>
        <button class="btn primary" id="cfgSave">保存</button>
      </div>
      <div class="btns"><button class="btn danger" id="cfgClear">清除本机记住的密码</button></div>
      <p class="hint" id="cfgStatus"></p>
    </div>
  </section>

  <!-- 底部 tab -->
  <nav class="tabbar">
    <button data-tab="inv" class="active"><span class="ic">📦</span>库存</button>
    <button data-tab="shelf"><span class="ic">🗄️</span>货架</button>
    <button data-tab="set"><span class="ic">⚙️</span>设置</button>
  </nav>

  <button class="fab" id="fabAdd">＋</button>

  <!-- 编辑/详情弹层 -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet"></div>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

  <div class="toast" id="toast"></div>

  <script src="./app.js?v=7"></script>
</body>
</html>
